name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: pyinstaller --noconfirm funpay_lots.spec
      - name: Self-test
        shell: pwsh
        run: |
          $p = Start-Process dist\FunPayLots.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:APPDATA\FunPayLots\selftest.log"
          exit $p.ExitCode
      - name: Smoke run (screenshot)
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process dist\FunPayLots.exe -PassThru
          Start-Sleep 20
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("smoke-windows.png")
          "alive after 20s: " + (-not $p.HasExited)
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Content "$env:APPDATA\FunPayLots\app.log" -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with: { name: FunPayLots-windows-x64, path: dist/FunPayLots.exe }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke-windows, path: smoke-windows.png, if-no-files-found: ignore }

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, arch: arm64 }       # Apple Silicon (M1–M4)
          - { runner: macos-15-intel, arch: x86_64 }    # Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: pyinstaller --noconfirm funpay_lots.spec
      - name: Self-test
        run: |
          file "dist/FunPay Lots.app/Contents/MacOS/FunPay Lots"
          "dist/FunPay Lots.app/Contents/MacOS/FunPay Lots" --selftest
      - name: Smoke run (screenshot)
        continue-on-error: true
        run: |
          open "dist/FunPay Lots.app"
          sleep 20
          screencapture -x smoke-macos-${{ matrix.arch }}.png
          pgrep -f "FunPay Lots.app" && echo "alive after 20s"
          pkill -f "FunPay Lots.app" || true
      - name: Pack .app
        run: cd dist && ditto -c -k --keepParent "FunPay Lots.app" FunPayLots-macos-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FunPayLots-macos-${{ matrix.arch }}
          path: dist/FunPayLots-macos-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-macos-${{ matrix.arch }}
          path: smoke-macos-*.png
          if-no-files-found: ignore

  linux:
    runs-on: ubuntu-22.04   # старый glibc — бинарник запустится на большинстве дистрибутивов
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: System libraries for Qt
        timeout-minutes: 15
        run: |
          # Зеркало Azure на раннерах GitHub иногда перестаёт находиться по DNS — тогда apt падает.
          # Ставим официальные зеркала Ubuntu первыми, Azure — запасным, и повторяем установку до трёх раз.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://security.ubuntu.com/ubuntu/\tpriority:2\nhttp://azure.archive.ubuntu.com/ubuntu/\tpriority:3\n' \
              | sudo tee /etc/apt/apt-mirrors.txt
          fi
          PKGS="libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0
            libxcb-shape0 libxcb-xinerama0 libegl1 libgl1 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2
            libdbus-1-3 xvfb imagemagick"
          for i in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y $PKGS; then exit 0; fi
            echo "::warning::apt attempt $i failed, retrying in 30 s"; sleep 30
          done
          exit 1
      - run: pip install -r requirements.txt
      - run: pyinstaller --noconfirm funpay_lots.spec
      - name: Self-test
        run: xvfb-run -a ./dist/FunPayLots --selftest
      - name: Smoke run (screenshot)
        continue-on-error: true
        run: |
          xvfb-run -a -s "-screen 0 1400x900x24" bash -c '
            ./dist/FunPayLots > smoke.log 2>&1 &
            APP=$!
            sleep 25
            import -window root smoke-linux.png
            kill -0 $APP && echo "alive after 25s"
            kill $APP || true'
          tail -n 30 smoke.log; cat ~/.config/funpay-lots/app.log 2>/dev/null || true
      - name: Pack
        run: |
          mkdir -p pkg/FunPayLots && cp dist/FunPayLots ui/icon.png pkg/FunPayLots/
          tar -C pkg -czf dist/FunPayLots-linux-x86_64.tar.gz FunPayLots
      - uses: actions/upload-artifact@v4
        with: { name: FunPayLots-linux-x86_64, path: dist/FunPayLots-linux-x86_64.tar.gz }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke-linux, path: smoke-linux.png, if-no-files-found: ignore }

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md (English) and CHANGELOG.ru.md (Russian)
        run: |
          section() { awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## "v" " {f=1; next} /^## / {f=0} f' "$1"; }
          { section CHANGELOG.md; if [ -f CHANGELOG.ru.md ]; then printf '\n<!-- ru -->\n\n'; section CHANGELOG.ru.md; fi; } > notes.md
          cat notes.md
      - uses: actions/download-artifact@v4
        with: { path: out, pattern: FunPayLots-* }
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            out/FunPayLots-windows-x64/FunPayLots.exe
            out/FunPayLots-macos-arm64/FunPayLots-macos-arm64.zip
            out/FunPayLots-macos-x86_64/FunPayLots-macos-x86_64.zip
            out/FunPayLots-linux-x86_64/FunPayLots-linux-x86_64.tar.gz
