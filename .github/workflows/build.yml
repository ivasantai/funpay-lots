name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: pyinstaller --noconfirm funpay_lots.spec
      - uses: actions/upload-artifact@v4
        with:
          name: FunPayLots-windows-x64
          path: dist/FunPayLots.exe

  macos:
    runs-on: macos-14   # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: pyinstaller --noconfirm funpay_lots.spec
      - name: Pack .app
        run: cd dist && ditto -c -k --keepParent "FunPay Lots.app" FunPayLots-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FunPayLots-macos-arm64
          path: dist/FunPayLots-macos-arm64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/FunPayLots-windows-x64/FunPayLots.exe
            out/FunPayLots-macos-arm64/FunPayLots-macos-arm64.zip
